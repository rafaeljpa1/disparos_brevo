[project]
name = "disparos-brevo"
version = "0.1.0"
description = "Disparos em massa de e-mail, SMS e WhatsApp via Brevo (PNLD)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
disparos-brevo = "disparos_brevo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["disparos_brevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
